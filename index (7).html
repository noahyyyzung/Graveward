{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="info">
  <h1>THE BRICK STUDIO</h1>
  <div class="by">made by Noah Young.</div>
  <div class="tip">Open this page in the Quest browser and press ENTER VR</div>
</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   CONSTANTS
   Grid: x/z in studs (P meters), y in plates (PH meters).
   A brick is 3 plates tall. A 2x4 brick is about hand sized.
   ========================================================= */
const P = 0.04, PH = 0.016, GAP = 0.0005, HALF = Math.PI / 2;
const SMALL = 0.085;            // shrink scale: you become ~3 bricks tall
const BGC = 0xf1f2f4;
const PALETTE = [0xf4f4f4, 0xa3a8ad, 0x5b6066, 0x1f2124, 0xd0201a, 0xfe8a18, 0xf8d22a, 0xe4cd9e,
                 0x7b4a2a, 0xa5ca18, 0x2aa148, 0x1a5c3a, 0x5fb8e8, 0x1e5aa8, 0x7d43a6, 0xff8ec6];
const UP = new THREE.Vector3(0, 1, 0);
const WHITE = new THREE.Color(0xffffff);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();
const _q = new THREE.Quaternion(), _m = new THREE.Matrix4(), _m2 = new THREE.Matrix4(), _m3 = new THREE.Matrix4(), _m4 = new THREE.Matrix4();
const _c = new THREE.Color();
const _key = (x, y, z) => x + ',' + y + ',' + z;

/* ---------- global state ---------- */
let curColor = 4;
let mode = 'big';           // 'big' builder or 'small' explorer
let trans = null;           // shrink / grow animation
let worldVer = 0;
let saveTimer = 0;
let slot = 1;
let tmpId = -1;
let turnLatch = false;
const thrown = [];
const animDoors = new Set();
const undoStack = [], redoStack = [];

/* =========================================================
   RENDERER / SCENE
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.xr.setFoveation(0.6);
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(BGC);
scene.fog = new THREE.Fog(BGC, 8, 55);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const MAT = {
  plastic: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.06, metalness: 0, transparent: true, opacity: 0.42, depthWrite: false }),
  glow: new THREE.MeshStandardMaterial({ color: 0xfff3c4, emissive: 0xffe8a0, emissiveIntensity: 1.3, roughness: 0.4 }),
};

function tintColor(hex, tint, out) {
  if (typeof tint === 'number') return out.set(tint);
  out.set(hex);
  if (tint === 'dark') out.multiplyScalar(0.62);
  else if (tint === 'glass') out.lerp(WHITE, 0.35);
  return out;
}

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
function N(g) {
  if (g.index) g = g.toNonIndexed();
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  return g;
}
function merge(list) { return mergeGeometries(list.map(N), false); }
function rbox(x0, y0, z0, x1, y1, z1, rad = 0.0018) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0;
  const r = Math.min(rad, w / 2.2, h / 2.2, d / 2.2);
  const g = new RoundedBoxGeometry(w, h, d, 2, r);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return g;
}
// box in cell units (studs x/z, plates y) with the seam gap
function cellBox(cx0, cy0, cz0, cx1, cy1, cz1) {
  return rbox(cx0 * P + GAP, cy0 * PH, cz0 * P + GAP, cx1 * P - GAP, cy1 * PH - GAP * 0.6, cz1 * P - GAP);
}
const STUD_R = 0.3 * P, STUD_H = 0.0075;
const STUD = (() => {
  const c = new THREE.CylinderGeometry(STUD_R, STUD_R, STUD_H, 10, 1, true); c.translate(0, STUD_H / 2, 0);
  const t = new THREE.CircleGeometry(STUD_R, 10); t.rotateX(-Math.PI / 2); t.translate(0, STUD_H, 0);
  return merge([c, t]);
})();
function studsAt(list) {
  return list.map(([cx, cz, ty]) => { const g = STUD.clone(); g.translate((cx + 0.5) * P, ty * PH - GAP * 0.6, (cz + 0.5) * P); return g; });
}
const allStuds = (w, d, h) => { const a = []; for (let x = 0; x < w; x++) for (let z = 0; z < d; z++) a.push([x, z, h]); return a; };
const backStuds = (w, h) => { const a = []; for (let x = 0; x < w; x++) a.push([x, 0, h]); return a; };
function cyl(rt, rb, h, seg, cx, cz, y0) { const g = new THREE.CylinderGeometry(rt, rb, h, seg); g.translate(cx, y0 + h / 2, cz); return g; }
// profile [z,y] (stud/plate units) extruded along x for w studs
function extrudeX(pts, w, d, h) {
  const s = new THREE.Shape();
  pts.forEach(([z, y], i) => {
    const zz = Math.min(Math.max(z * P, GAP), d * P - GAP), yy = Math.min(y * PH, h * PH - GAP * 0.6);
    if (i) s.lineTo(-zz, yy); else s.moveTo(-zz, yy);
  });
  const g = new THREE.ExtrudeGeometry(s, { depth: w * P - 2 * GAP, bevelEnabled: false, curveSegments: 4 });
  g.rotateY(Math.PI / 2); g.translate(GAP, 0, 0);
  return g;
}

/* =========================================================
   PIECE TYPES
   cells: occupied grid cells. studs: [x, z, topPlate].
   parts: separately-colored meshes (tint 'self' = chosen color).
   ========================================================= */
const TYPES = [], T = {};
function def(o) {
  if (!o.cells) { o.cells = []; for (let x = 0; x < o.w; x++) for (let y = 0; y < o.h; y++) for (let z = 0; z < o.d; z++) o.cells.push([x, y, z]); }
  o.studs = o.studs || [];
  const own = new Set(o.cells.map(c => _key(c[0], c[1], c[2])));
  const studTop = new Set(o.studs.map(s => _key(s[0], s[2] - 1, s[1])));
  const openSet = o.openCells ? new Set(o.openCells.map(c => _key(c[0], c[1], c[2]))) : null;
  const info = o.cells.map(([x, y, z]) => ({ x, y, z, top: studTop.has(_key(x, y, z)), bot: !own.has(_key(x, y - 1, z)), open: !!(openSet && openSet.has(_key(x, y, z))) }));
  o.rc = [0, 1, 2, 3].map(r => info.map(c => {
    let x = c.x, z = c.z;
    for (let i = 0; i < r; i++) { const nx = z, nz = -x - 1; x = nx; z = nz; }
    return { x, y: c.y, z, top: c.top, bot: c.bot, open: c.open };
  }));
  o.bb = o.rc.map(cs => {
    const b = { x0: 1e9, y0: 1e9, z0: 1e9, x1: -1e9, y1: -1e9, z1: -1e9 };
    for (const c of cs) { b.x0 = Math.min(b.x0, c.x); b.y0 = Math.min(b.y0, c.y); b.z0 = Math.min(b.z0, c.z); b.x1 = Math.max(b.x1, c.x + 1); b.y1 = Math.max(b.y1, c.y + 1); b.z1 = Math.max(b.z1, c.z + 1); }
    return b;
  });
  o.idx = TYPES.length; TYPES.push(o); T[o.id] = o;
  return o;
}
function boxPiece(id, name, cat, w, d, h, opt = {}) {
  const studs = opt.studs === false ? [] : allStuds(w, d, h);
  const g = merge([cellBox(0, 0, 0, w, h, d), ...studsAt(studs)]);
  return def({ id, name, cat, w, d, h, studs, parts: [{ g, tint: opt.tint || 'self', mat: opt.mat || 'plastic' }] });
}
function slopePiece(id, name, w, d, h, pts, studs) {
  return def({ id, name, cat: 'slopes', w, d, h, studs, parts: [{ g: merge([extrudeX(pts, w, d, h), ...studsAt(studs)]), tint: 'self', mat: 'plastic' }] });
}

// ---- Bricks
[[1, 1], [1, 2], [1, 3], [1, 4], [1, 6], [1, 8], [2, 2], [2, 3], [2, 4], [2, 6], [2, 8], [4, 4]]
  .forEach(([a, b]) => boxPiece(`b${a}x${b}`, `Brick ${a}x${b}`, 'bricks', b, a, 3));
boxPiece('tb1x2', 'Tall 1x2', 'bricks', 2, 1, 6);
boxPiece('tb2x2', 'Tall 2x2', 'bricks', 2, 2, 6);

// ---- Plates and tiles
[[1, 1], [1, 2], [1, 4], [2, 2], [2, 4], [4, 4], [4, 8], [8, 8], [16, 16]]
  .forEach(([a, b]) => boxPiece(`p${a}x${b}`, `Plate ${a}x${b}`, 'plates', b, a, 1));
[[1, 1], [1, 2], [2, 2], [2, 4], [4, 4], [8, 8]]
  .forEach(([a, b]) => boxPiece(`t${a}x${b}`, `Tile ${a}x${b}`, 'plates', b, a, 1, { studs: false }));

// ---- Slopes and curves
const SLOPE45 = [[0, 0], [2, 0], [2, 1], [1, 3], [0, 3]];
slopePiece('s1x2', 'Slope 1x2', 1, 2, 3, SLOPE45, backStuds(1, 3));
slopePiece('s2x2', 'Slope 2x2', 2, 2, 3, SLOPE45, backStuds(2, 3));
slopePiece('s4x2', 'Slope 4x2', 4, 2, 3, SLOPE45, backStuds(4, 3));
slopePiece('s2x3', 'Long Slope', 2, 3, 3, [[0, 0], [3, 0], [3, 1], [1, 3], [0, 3]], backStuds(2, 3));
const INV = [[0, 0], [1, 0], [2, 2], [2, 3], [0, 3]];
slopePiece('i1x2', 'Inv Slope 1x2', 1, 2, 3, INV, allStuds(1, 2, 3));
slopePiece('i2x2', 'Inv Slope 2x2', 2, 2, 3, INV, allStuds(2, 2, 3));
const curvePts = d => { const a = [[0, 0], [d, 0], [d, 1]]; for (let i = 1; i < 12; i++) { const t = HALF * (1 - i / 12); a.push([d * Math.sin(t), 1 + 2 * Math.cos(t)]); } a.push([0, 3]); return a; };
slopePiece('c2x2', 'Curve 2x2', 2, 2, 3, curvePts(2), []);
slopePiece('c1x4', 'Curve 1x4', 1, 4, 3, curvePts(4), []);
const RIDGE = [[0, 0], [2, 0], [2, 1], [1, 3], [0, 1]];
slopePiece('r2x2', 'Roof Peak 2x2', 2, 2, 3, RIDGE, []);
slopePiece('r4x2', 'Roof Peak 4x2', 4, 2, 3, RIDGE, []);
(() => { // Arch 1x4
  const s = new THREE.Shape(), top = 3 * PH - GAP * 0.6;
  s.moveTo(GAP, 0); s.lineTo(P, 0);
  for (let i = 1; i < 16; i++) { const a = Math.PI - Math.PI * i / 16; s.lineTo(2 * P + P * Math.cos(a), 2 * PH * Math.sin(a)); }
  s.lineTo(3 * P, 0); s.lineTo(4 * P - GAP, 0); s.lineTo(4 * P - GAP, top); s.lineTo(GAP, top);
  const g = new THREE.ExtrudeGeometry(s, { depth: P - 2 * GAP, bevelEnabled: false }); g.translate(0, 0, GAP);
  const cells = []; for (const x of [0, 3]) for (let y = 0; y < 3; y++) cells.push([x, y, 0]); cells.push([1, 2, 0], [2, 2, 0]);
  const studs = allStuds(4, 1, 3);
  def({ id: 'arch', name: 'Arch 1x4', cat: 'slopes', w: 4, d: 1, h: 3, cells, studs, parts: [{ g: merge([g, ...studsAt(studs)]), tint: 'self', mat: 'plastic' }] });
})();
def({ id: 'rnd1', name: 'Round 1x1', cat: 'slopes', w: 1, d: 1, h: 3, studs: [[0, 0, 3]],
  parts: [{ g: merge([cyl(0.47 * P, 0.47 * P, 3 * PH - GAP * 0.6, 16, 0.5 * P, 0.5 * P, 0), ...studsAt([[0, 0, 3]])]), tint: 'self', mat: 'plastic' }] });
def({ id: 'rnd2', name: 'Round 2x2', cat: 'slopes', w: 2, d: 2, h: 3, studs: allStuds(2, 2, 3),
  parts: [{ g: merge([cyl(0.97 * P, 0.97 * P, 3 * PH - GAP * 0.6, 24, P, P, 0), ...studsAt(allStuds(2, 2, 3))]), tint: 'self', mat: 'plastic' }] });
(() => {
  const sp = new THREE.SphereGeometry(0.97 * P, 20, 8, 0, Math.PI * 2, 0, HALF);
  sp.scale(1, (2 * PH - GAP) / (0.97 * P), 1); sp.translate(P, PH, P);
  def({ id: 'dome', name: 'Dome 2x2', cat: 'slopes', w: 2, d: 2, h: 3, studs: [],
    parts: [{ g: merge([cyl(0.97 * P, 0.97 * P, PH, 24, P, P, 0), sp]), tint: 'self', mat: 'plastic' }] });
})();
def({ id: 'cone', name: 'Cone 1x1', cat: 'slopes', w: 1, d: 1, h: 3, studs: [[0, 0, 3]],
  parts: [{ g: merge([cyl(0.3 * P, 0.47 * P, 3 * PH - GAP * 0.6, 16, 0.5 * P, 0.5 * P, 0), ...studsAt([[0, 0, 3]])]), tint: 'self', mat: 'plastic' }] });

// ---- House
(() => { // Door 1x4x5 with opening panel
  const h = 15, studs = allStuds(4, 1, h);
  const frame = [cellBox(0, 0, 0, 1, h, 1), cellBox(3, 0, 0, 4, h, 1), cellBox(1, 12, 0, 3, h, 1), ...studsAt(studs)];
  const panel = rbox(P + 0.0015, 0.0005, 0.33 * P, 3 * P - 0.0015, 12 * PH - 0.0015, 0.67 * P, 0.002);
  const k1 = new THREE.SphereGeometry(0.11 * P, 10, 8); k1.translate(2.65 * P, 6 * PH, 0.67 * P + 0.003);
  const k2 = k1.clone(); k2.translate(0, 0, -(0.34 * P + 0.006));
  const openCells = []; for (const x of [1, 2]) for (let y = 0; y < 12; y++) openCells.push([x, y, 0]);
  def({ id: 'door', name: 'Door', cat: 'house', w: 4, d: 1, h, studs, openCells, door: true,
    parts: [{ g: merge(frame), tint: 'self', mat: 'plastic' },
            { g: merge([panel, k1, k2]), tint: 'dark', mat: 'plastic', door: true, hinge: [P, 0, 0.5 * P] }] });
})();
function windowPiece(id, name, w, h) {
  const t = 0.22 * P, studs = allStuds(w, 1, h);
  const fr = [cellBox(0, 0, 0, w, 1, 1), cellBox(0, h - 1, 0, w, h, 1),
    rbox(GAP, PH, GAP, t, (h - 1) * PH, P - GAP), rbox(w * P - t, PH, GAP, w * P - GAP, (h - 1) * PH, P - GAP)];
  if (w >= 4) fr.push(rbox(w * P / 2 - 0.1 * P, PH, 0.3 * P, w * P / 2 + 0.1 * P, (h - 1) * PH, 0.7 * P));
  fr.push(...studsAt(studs));
  const gl = rbox(t, PH, 0.44 * P, w * P - t, (h - 1) * PH, 0.56 * P, 0.001);
  return def({ id, name, cat: 'house', w, d: 1, h, studs, parts: [{ g: merge(fr), tint: 'self', mat: 'plastic' }, { g: N(gl), tint: 0xcfeaff, mat: 'glass' }] });
}
windowPiece('winS', 'Window S', 2, 6);
windowPiece('winL', 'Window L', 4, 9);
boxPiece('gwall', 'Glass Wall', 'house', 4, 1, 9, { mat: 'glass', tint: 'glass' });
[[1, 1], [1, 2], [1, 4], [2, 2], [2, 4]].forEach(([a, b]) => boxPiece(`g${a}x${b}`, `Glass ${a}x${b}`, 'house', b, a, 3, { mat: 'glass', tint: 'glass' }));
function stairs(id, name, w) {
  const geos = [], cells = [];
  for (let k = 0; k < 4; k++) {
    const hk = (k + 1) * 3; geos.push(cellBox(0, 0, k, w, hk, k + 1));
    for (let x = 0; x < w; x++) for (let y = 0; y < hk; y++) cells.push([x, y, k]);
  }
  const st = []; for (let x = 0; x < w; x++) st.push([x, 3, 12]);
  geos.push(...studsAt(st));
  return def({ id, name, cat: 'house', w, d: 4, h: 12, cells, studs: st, parts: [{ g: merge(geos), tint: 'self', mat: 'plastic' }] });
}
stairs('st2', 'Stairs', 2);
stairs('st4', 'Wide Stairs', 4);
(() => {
  const geos = [cellBox(0, 0, 0, 4, 1, 1)];
  for (let i = 0; i < 8; i++) { const cx = (i + 0.5) * P / 2; geos.push(rbox(cx - 0.07 * P, PH, 0.4 * P, cx + 0.07 * P, 2.95 * PH, 0.6 * P, 0.001)); }
  geos.push(rbox(GAP, 1.8 * PH, 0.36 * P, 4 * P - GAP, 2.2 * PH, 0.64 * P, 0.001));
  def({ id: 'fence', name: 'Fence', cat: 'house', w: 4, d: 1, h: 3, studs: [], parts: [{ g: merge(geos), tint: 'self', mat: 'plastic' }] });
})();

// ---- Fun
(() => { // googly eye 1x1
  const studs = [[0, 0, 3]];
  const w = new THREE.SphereGeometry(0.42 * P, 18, 12); w.scale(1, 1, 0.5); w.translate(0.5 * P, 1.5 * PH, P);
  const p = new THREE.SphereGeometry(0.2 * P, 14, 10); p.scale(1, 1, 0.5); p.translate(0.5 * P, 1.25 * PH, P + 0.42 * P * 0.5 - 0.0012);
  def({ id: 'eye', name: 'Eye', cat: 'fun', w: 1, d: 1, h: 3, studs,
    parts: [{ g: merge([cellBox(0, 0, 0, 1, 3, 1), ...studsAt(studs)]), tint: 'self', mat: 'plastic' },
            { g: N(w), tint: 0xffffff, mat: 'plastic' }, { g: N(p), tint: 0x111214, mat: 'plastic' }] });
})();
(() => { // big googly eye
  const studs = allStuds(2, 1, 6);
  const w = new THREE.SphereGeometry(0.88 * P, 24, 16); w.scale(1, 1, 0.5); w.translate(P, 3 * PH, P);
  const p = new THREE.SphereGeometry(0.42 * P, 18, 12); p.scale(1, 1, 0.5); p.translate(P, 2.6 * PH, P + 0.88 * P * 0.5 - 0.0025);
  def({ id: 'bigeye', name: 'Big Eye', cat: 'fun', w: 2, d: 1, h: 6, studs,
    parts: [{ g: merge([cellBox(0, 0, 0, 2, 6, 1), ...studsAt(studs)]), tint: 'self', mat: 'plastic' },
            { g: N(w), tint: 0xffffff, mat: 'plastic' }, { g: N(p), tint: 0x111214, mat: 'plastic' }] });
})();
(() => { // flower
  const green = merge([cyl(0.45 * P, 0.45 * P, PH, 14, 0.5 * P, 0.5 * P, 0), cyl(0.06 * P, 0.06 * P, 1.6 * PH, 6, 0.5 * P, 0.5 * P, PH)]);
  const petals = []; for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; const s = new THREE.SphereGeometry(0.17 * P, 10, 8); s.translate(0.5 * P + 0.2 * P * Math.cos(a), 2.6 * PH, 0.5 * P + 0.2 * P * Math.sin(a)); petals.push(s); }
  const ctr = new THREE.SphereGeometry(0.12 * P, 10, 8); ctr.translate(0.5 * P, 2.72 * PH, 0.5 * P);
  def({ id: 'flower', name: 'Flower', cat: 'fun', w: 1, d: 1, h: 3, studs: [],
    parts: [{ g: green, tint: 0x3f9b3f, mat: 'plastic' }, { g: merge(petals), tint: 'self', mat: 'plastic' }, { g: N(ctr), tint: 0xffd23a, mat: 'plastic' }] });
})();
(() => { // tree
  const trunk = cyl(0.26 * P, 0.3 * P, 4.5 * PH, 10, P, P, 0);
  const c1 = new THREE.CylinderGeometry(0, 0.98 * P, 5.5 * PH, 16); c1.translate(P, 3.5 * PH + 2.75 * PH, P);
  const c2 = new THREE.CylinderGeometry(0, 0.75 * P, 4.5 * PH, 16); c2.translate(P, 7 * PH + 2.25 * PH, P);
  def({ id: 'tree', name: 'Tree', cat: 'fun', w: 2, d: 2, h: 12, studs: [],
    parts: [{ g: N(trunk), tint: 0x7a4a26, mat: 'plastic' }, { g: merge([c1, c2]), tint: 'self', mat: 'plastic' }] });
})();
(() => { // wheels
  const studs = allStuds(2, 2, 4);
  const body = merge([cellBox(0, 3, 0, 2, 4, 2), ...studsAt(studs)]);
  const axle = rbox(0.15 * P, 1.5 * PH, 0.75 * P, 1.85 * P, 3 * PH, 1.25 * P);
  const tires = [], rims = [];
  for (const xs of [-0.18 * P, 2.18 * P]) {
    const t = new THREE.CylinderGeometry(2 * PH, 2 * PH, 0.4 * P, 22); t.rotateZ(HALF); t.translate(xs, 2 * PH, P); tires.push(t);

function trackHand(h, now) {

  h.grabObj.getWorldPosition(_v1); rig.worldToLocal(_v1);
  h.hist.push({ t: now, p: _v1.clone() }); while (h.hist.length > 8) h.hist.shift();
}
function handVel(h) {
  const H = h.hist; if (H.length < 2) return new THREE.Vector3();
  const a = H[Math.max(0, H.length - 6)], b = H[H.length - 1], dt = b.t - a.t;
  return dt > 0 ? b.p.clone().sub(a.p).divideScalar(dt) : new THREE.Vector3();
}
function updateOutline(h) {
  const o = h.outline;
  if (h.held || !h.grabObj || trans) { o.visible = false; return; }
  h.grabObj.getWorldPosition(_v1);
  const id = mode === 'big' ? world.nearest(_v1, 0.05) : world.nearest(_v1, 0.6 * P, b => TYPES[b.t].door);
  if (!id) { o.visible = false; return; }
  const b = world.bricks.get(id), bb = TYPES[b.t].bb[b.r], pad = 0.002 * rig.scale.x;
  o.visible = true;
  o.position.set((b.x + (bb.x0 + bb.x1) / 2) * P, (b.y + (bb.y0 + bb.y1) / 2) * PH, (b.z + (bb.z0 + bb.z1) / 2) * P);
  o.scale.set((bb.x1 - bb.x0) * P + pad, (bb.y1 - bb.y0) * PH + pad, (bb.z1 - bb.z0) * P + pad);
}

/* =========================================================
   UNDO / REDO
   ========================================================= */
function pushUndo(rec) {
  if (!rec.removed.length && !rec.added.length) return;
  undoStack.push(rec); if (undoStack.length > 60) undoStack.shift(); redoStack.length = 0;
}
function applyRec(rec, inverse) {
  for (const s of (inverse ? rec.added : rec.removed)) world.remove(s.id);
  for (const s of (inverse ? rec.removed : rec.added)) world.add(s);
}
function undo() { if (anyHeld()) return; const r = undoStack.pop(); if (!r) return; applyRec(r, true); redoStack.push(r); sPop(); }
function redo() { if (anyHeld()) return; const r = redoStack.pop(); if (!r) return; applyRec(r, false); undoStack.push(r); sPop(); }
function clearWorld() {
  if (anyHeld()) return;
  const removed = [...world.bricks.values()].map(strip);
  world.clearAll(); pushUndo({ removed, added: [] }); sTrash();
}

/* =========================================================
   DOORS
   ========================================================= */
function toggleDoor(id) {
  const b = world.bricks.get(id); if (!b) return;
  if (b.open && playerInDoor(b)) return;
  b.open = !b.open; animDoors.add(id); worldVer++; sDoor();
}
function playerInDoor(b) {
  for (const c of world.cells(b)) {
    if (!c.open) continue;
    if (pl.x + PR > c.x && pl.x - PR < c.x + 1 && pl.z + PR > c.z && pl.z - PR < c.z + 1 && pl.y + PHT > c.y && pl.y < c.y + 1) return true;
  }
  return false;
}
function updateDoors(dt) {
  for (const id of animDoors) {
    const b = world.bricks.get(id); if (!b) { animDoors.delete(id); continue; }
    const target = b.open ? 1.45 : 0;
    b.ang += (target - b.ang) * Math.min(1, dt * 9);
    if (Math.abs(target - b.ang) < 0.005) { b.ang = target; animDoors.delete(id); }
    world.batch.update(b);
  }
}

/* =========================================================
   MOVEMENT
   ========================================================= */
const pl = { x: 0, y: 0, z: 0, vy: 0, ground: false };
const PR = 0.35, PHT = 9, STEP = 3.05;
const GRAV = 9.8 * SMALL / PH, JUMP = Math.sqrt(2 * GRAV * 4.2), WALK = 2.2 * SMALL / P;
function solidBox(x0, x1, y0, y1, z0, z1) {
  for (let x = Math.floor(x0); x < Math.ceil(x1); x++) for (let z = Math.floor(z0); z < Math.ceil(z1); z++) for (let y = Math.floor(y0); y < Math.ceil(y1); y++) if (world.isSolid(x, y, z)) return true;
  return false;
}
function topIn(x0, x1, y0, y1, z0, z1) {
  let t = -Infinity;
  for (let x = Math.floor(x0); x < Math.ceil(x1); x++) for (let z = Math.floor(z0); z < Math.ceil(z1); z++) for (let y = Math.floor(y0); y < Math.ceil(y1); y++) if (world.isSolid(x, y, z)) t = Math.max(t, y + 1);
  return t;
}
const bodyHit = (x, y, z) => solidBox(x - PR, x + PR, y + 0.02, y + PHT, z - PR, z + PR);
function tryMove(ax, d) {
  const nx = ax === 'x' ? pl.x + d : pl.x, nz = ax === 'z' ? pl.z + d : pl.z;
  if (!bodyHit(nx, pl.y, nz)) { pl.x = nx; pl.z = nz; return; }
  if (pl.ground) {
    const t = topIn(nx - PR, nx + PR, pl.y + 0.02, pl.y + STEP, nz - PR, nz + PR);
    if (t > pl.y && t - pl.y <= STEP && !bodyHit(nx, t, nz)) { pl.x = nx; pl.z = nz; pl.y = t; }
  }
}
function stickOf(h) {
  const gp = h && h.src && h.src.gamepad; if (!gp || gp.axes.length < 4) return [0, 0];
  const dz = v => Math.abs(v) < 0.15 ? 0 : (v - Math.sign(v) * 0.15) / 0.85;
  return [dz(gp.axes[2]), dz(gp.axes[3])];
}
function updateBig(dt, L, Rh) {
  const [lx, ly] = stickOf(L), [rx, ry] = stickOf(Rh), yaw = headYawWorld();
  const boost = L && L.bNow[0] ? 3 : 1, sp = 1.5 * boost;
  rig.position.x += (-Math.sin(yaw) * (-ly) + Math.cos(yaw) * lx) * sp * dt;
  rig.position.z += (-Math.cos(yaw) * (-ly) - Math.sin(yaw) * lx) * sp * dt;
  if (Math.abs(ry) > Math.abs(rx)) rig.position.y = Math.max(0, rig.position.y - ry * 1.3 * boost * dt);
}
function updateSmall(dt, L, Rh) {
  const hp = headWorld(_v1), tx = hp.x / P, tz = hp.z / P;
  const [lx, ly] = stickOf(L), yaw = headYawWorld();
  const mxv = (-Math.sin(yaw) * (-ly) + Math.cos(yaw) * lx) * WALK * dt;
  const mzv = (-Math.cos(yaw) * (-ly) - Math.sin(yaw) * lx) * WALK * dt;
  const gx = tx + mxv, gz = tz + mzv, dx = gx - pl.x, dz = gz - pl.z;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dz)) / 0.25));
  for (let i = 0; i < n; i++) { tryMove('x', dx / n); tryMove('z', dz / n); }
  if (Rh && Rh.ev.b4 && pl.ground) { pl.vy = JUMP; pl.ground = false; sJump(); }
  pl.vy = Math.max(-80, pl.vy - GRAV * dt);
  const ny = pl.y + pl.vy * dt;
  if (pl.vy <= 0) {
    const t = topIn(pl.x - PR, pl.x + PR, ny, pl.y + 0.01, pl.z - PR, pl.z + PR);
    if (t > -Infinity && t >= ny) { pl.y = Math.max(t, ny); pl.vy = 0; pl.ground = true; }
    else { pl.y = ny; pl.ground = false; }
  } else {
    if (solidBox(pl.x - PR, pl.x + PR, pl.y + PHT, ny + PHT, pl.z - PR, pl.z + PR)) pl.vy = 0; else pl.y = ny;
    pl.ground = false;
  }
  if (bodyHit(pl.x, pl.y, pl.z)) { // pushed into something: climb out
    const t = topIn(pl.x - PR, pl.x + PR, pl.y, pl.y + PHT, pl.z - PR, pl.z + PR);
    if (t - pl.y < 4) pl.y = t;
  }
  rig.position.x += (pl.x - tx) * P; rig.position.z += (pl.z - tz) * P; rig.position.y = pl.y * PH;
}
function snapTurn(a) {
  const hp = headWorld(new THREE.Vector3());
  rig.position.sub(hp).applyAxisAngle(UP, a).add(hp); rig.rotation.y += a;
}
function groundUnder(hp) {
  const x = Math.floor(hp.x / P), z = Math.floor(hp.z / P);
  for (let y = Math.max(1, Math.floor(hp.y / PH)); y >= 1; y--)
    if (world.isSolid(x, y - 1, z) && !bodyHit(hp.x / P, y, hp.z / P)) return y * PH;
  return 0;
}
function setMode(m) {
  if (trans || m === mode) return;
  dropEverything();
  const hp = headWorld(new THREE.Vector3());
  trans = { m, from: rig.scale.x, to: m === 'small' ? SMALL : 1, t: 0, hx: hp.x, hz: hp.z, y0: rig.position.y, y1: m === 'small' ? groundUnder(hp) : rig.position.y };
  if (m === 'small') sShrink(); else sGrow();
}
function updateTrans(dt) {
  const t = trans; t.t = Math.min(1, t.t + dt / 0.9);
  const e = t.t * t.t * (3 - 2 * t.t), s = t.from + (t.to - t.from) * e;
  rig.scale.setScalar(s);
  const cl = camera.position; _v1.set(cl.x * s, 0, cl.z * s).applyAxisAngle(UP, rig.rotation.y);
  rig.position.x = t.hx - _v1.x; rig.position.z = t.hz - _v1.z; rig.position.y = t.y0 + (t.y1 - t.y0) * e;
  applyScaleEnv(s);
  if (t.t >= 1) {
    mode = t.m; trans = null;
    if (mode === 'small') { pl.x = t.hx / P; pl.z = t.hz / P; pl.y = t.y1 / PH; pl.vy = 0; pl.ground = true; }
    menu.miniRoot.visible = mode === 'big';
    drawMenu();
  }
}

/* =========================================================
   SAVE SLOTS (auto-save)
   ========================================================= */
const SKEY = 'brickstudio_slot_';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
};
function serialize() { const b = []; for (const x of world.bricks.values()) b.push([TYPES[x.t].id, x.c, x.x, x.y, x.z, x.r]); return JSON.stringify({ v: 1, b }); }
function saveNow() { store.set(SKEY + slot, serialize()); store.set('brickstudio_cur', String(slot)); saveTimer = 0; }
function loadSlot(n) {
  world.clearAll(); undoStack.length = 0; redoStack.length = 0;
  try { const s = JSON.parse(store.get(SKEY + n) || 'null'); if (s && s.b) for (const [tid, c, x, y, z, r] of s.b) { const t = T[tid]; if (t) world.add({ t: t.idx, c, x, y, z, r }); } } catch (e) { }
  saveTimer = 0;
}
function switchSlot(d) {
  if (anyHeld()) return;
  saveNow(); slot = ((slot - 1 + d) % 5 + 5) % 5 + 1; loadSlot(slot); store.set('brickstudio_cur', String(slot));
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
renderer.xr.addEventListener('sessionend', saveNow);

/* starter scene: a little house so the room isn't empty the first time */
function seedStarter() {
  const S = (id, c, x, y, z, r = 0) => world.add({ t: T[id].idx, c, x, y, z, r });
  const X0 = -4, Z0 = -26;
  S('p16x16', 10, X0 - 4, 0, Z0 - 5);
  [1, 4, 7, 10, 13].forEach((y, ci) => {
    if (ci % 2 === 0) { S('b1x4', 0, X0, y, Z0); S('b1x4', 0, X0 + 4, y, Z0); }
    else { S('b1x2', 0, X0, y, Z0); S('b1x4', 0, X0 + 2, y, Z0); S('b1x2', 0, X0 + 6, y, Z0); }
    S('b1x2', 0, X0, y, Z0 + 5); S('b1x2', 0, X0 + 6, y, Z0 + 5);
    if (ci === 0 || ci === 4) { S('b1x4', 0, X0, y, Z0 + 5, 1); S('b1x4', 0, X0 + 7, y, Z0 + 5, 1); }
  });
  S('winL', 0, X0, 4, Z0 + 5, 1); S('winL', 0, X0 + 7, 4, Z0 + 5, 1);
  S('door', 8, X0 + 2, 1, Z0 + 5);
  S('p4x8', 4, X0, 16, Z0); S('p2x4', 4, X0, 16, Z0 + 4); S('p2x4', 4, X0 + 4, 16, Z0 + 4);
  S('s4x2', 4, X0, 17, Z0 + 4); S('s4x2', 4, X0 + 4, 17, Z0 + 4);
  S('s4x2', 4, X0 + 4, 17, Z0 + 2, 2); S('s4x2', 4, X0 + 8, 17, Z0 + 2, 2);
  S('b2x4', 4, X0, 17, Z0 + 2); S('b2x4', 4, X0 + 4, 17, Z0 + 2);
  S('r4x2', 4, X0, 20, Z0 + 2); S('r4x2', 4, X0 + 4, 20, Z0 + 2);
  S('t2x2', 1, X0 + 3, 1, Z0 + 6); S('t2x2', 1, X0 + 3, 1, Z0 + 8);
  S('tree', 9, X0 + 8, 1, Z0 + 7);
  S('flower', 4, X0 - 3, 1, Z0 + 8); S('flower', 6, X0 - 2, 1, Z0 + 9); S('flower', 15, X0 - 3, 1, Z0 + 7);
  S('lamp', 3, X0 - 2, 1, Z0 + 6);
  S('b2x4', 9, 10, 0, -23); S('bigeye', 12, 10, 3, -22); S('b1x2', 9, 10, 3, -23); S('s2x2', 9, 12, 3, -23);
  undoStack.length = 0;
}

/* =========================================================
   INPUT + MAIN LOOP
   ========================================================= */
function readHand(h) {
  h.ev = {};
  const gp = h.src && h.src.gamepad; if (!gp) { h.trig = h.sq = 0; return; }
  const b = gp.buttons;
  h.trig = b[0] ? b[0].value : 0; h.sq = b[1] ? b[1].value : 0;
  const tP = h.tOn, gP = h.gOn;
  h.tOn = tP ? h.trig > 0.3 : h.trig > 0.6;
  h.gOn = gP ? h.sq > 0.3 : h.sq > 0.6;
  h.ev.tDown = h.tOn && !tP; h.ev.tUp = !h.tOn && tP; h.ev.gDown = h.gOn && !gP; h.ev.gUp = !h.gOn && gP;
  h.bNow = [!!(b[3] && b[3].pressed), !!(b[4] && b[4].pressed), !!(b[5] && b[5].pressed)];
  h.ev.b4 = h.bNow[1] && !h.bPrev[1]; h.ev.b5 = h.bNow[2] && !h.bPrev[2];
  h.bPrev = h.bNow;
}
const clock = new THREE.Clock();
function update(dt, now) {
  for (const h of hands) readHand(h);
  const L = hands.find(h => h.side === 'left' && h.src), Rh = hands.find(h => h.side === 'right' && h.src);
  if (L && L.ev.b5) toggleMenu();

  if (trans) updateTrans(dt);
  else if (mode === 'big') updateBig(dt, L, Rh);
  else updateSmall(dt, L, Rh);

  if (Rh && Rh.src.gamepad && !trans) {
    const gp = Rh.src.gamepad, rx = gp.axes.length >= 4 ? gp.axes[2] : 0, ry = gp.axes.length >= 4 ? gp.axes[3] : 0;
    if (!turnLatch && Math.abs(rx) > 0.7 && Math.abs(rx) > Math.abs(ry)) { snapTurn(rx > 0 ? -Math.PI / 6 : Math.PI / 6); turnLatch = true; }
    if (Math.abs(rx) < 0.3) turnLatch = false;
  }
  rig.updateMatrixWorld(true);

  let hover = null;
  for (const h of hands) {
    if (!h.src) continue;
    poseHand(h); trackHand(h, now);
    if (!trans) {
      if (!h.held) { if (h.ev.tDown) tryGrab(h, 'trig'); else if (h.ev.gDown) tryGrab(h, 'grip'); }
      else if ((h.holdBtn === 'trig' && h.ev.tUp) || (h.holdBtn === 'grip' && h.ev.gUp)) releaseHand(h);
    }
    if (h.held) { h.held.hand = h; updateGhost(h); }
    const hv = pokeCheck(h); if (hv) hover = hv;
    updateOutline(h);
  }
  if (menu.open && hover !== menu.hover) { menu.hover = hover; drawMenu(); }

  updateThrown(dt);
  updateDoors(dt);
  updateBin(dt);

  if (menu.open && mode === 'big') {
    for (const m of menu.minis) {
      m.spin += dt * 0.7;
      let near = false;
      for (const h of hands) if (h.grabObj && !h.held) { h.grabObj.getWorldPosition(_v1); m.g.getWorldPosition(_v2); if (_v1.distanceTo(_v2) < 0.05 * rig.scale.x) near = true; }
      const tgt = m.g.userData.base * (near ? 1.25 : 1);
      m.g.scale.setScalar(m.g.scale.x + (tgt - m.g.scale.x) * Math.min(1, dt * 12));
      m.g.rotation.set(0.45, m.spin, 0);
    }
  }
  if (menu.clearArm > 0) { menu.clearArm -= dt; if (menu.clearArm <= 0) { menu.clearArm = 0; if (menu.open) drawMenu(); } }

  for (let i = poofs.length - 1; i >= 0; i--) {
    const p = poofs[i]; p.userData.life -= dt; p.position.addScaledVector(p.userData.v, dt); p.userData.v.y -= 2 * dt;
    p.material.opacity = Math.max(0, p.userData.life / 0.5); p.rotation.x += dt * 8;
    if (p.userData.life <= 0) { scene.remove(p); p.material.dispose(); poofs.splice(i, 1); }
  }

  const hp = headWorld(_v3);
  floor.position.x = Math.round(hp.x / TILE) * TILE; floor.position.z = Math.round(hp.z / TILE) * TILE;
  const snapS = shadowHalf / 64;
  sun.target.position.set(Math.round(hp.x / snapS) * snapS, Math.max(0, hp.y - shadowHalf * 0.4), Math.round(hp.z / snapS) * snapS);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, shadowHalf * 3);

  if (saveTimer > 0) { saveTimer -= dt; if (saveTimer <= 0) { saveNow(); if (menu.open) drawMenu(); } }
}
renderer.setAnimationLoop((time) => {
  const dt = Math.min(0.05, clock.getDelta());
  update(dt, time / 1000);
  renderer.render(scene, camera);
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
renderer.xr.addEventListener('sessionstart', () => { ac(); rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0); });

/* boot */
slot = parseInt(store.get('brickstudio_cur') || '1', 10) || 1;
if (slot < 1 || slot > 5) slot = 1;
loadSlot(slot);
if (world.bricks.size === 0 && slot === 1 && !store.get('brickstudio_seeded')) { seedStarter(); store.set('brickstudio_seeded', '1'); saveNow(); }
rebuildMinis();
drawMenu();
</script>
</body>
