<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRAVEWARD - Chapter 1</title>
<style>
html,body{margin:0;height:100%;background:#04050a;color:#cdd1da;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#151a26 0%,#05060a 70%)}
#ui h1{font-weight:400;letter-spacing:.4em;font-size:clamp(30px,8vw,72px);margin:0 0 4px;color:#e9e3d2;text-shadow:0 0 30px #6a7bb8}
#ui h2{font-weight:400;font-style:italic;font-size:clamp(14px,3vw,22px);margin:0 0 28px;color:#8b93a8}
#ui button{font:inherit;font-size:18px;letter-spacing:.18em;padding:14px 30px;margin:8px;background:#1a1f2e;color:#e9e3d2;border:1px solid #55608a;border-radius:4px;cursor:pointer}

</style>
</head>
<body>
<div id="ui">
  <h1>GRAVEWARD</h1>
  <h2>Chapter 1 &mdash; The Ashen Road</h2>
  <button id="bVR" disabled>ENTER VR</button>
  <button id="bFlat">PLAY ON SCREEN (PREVIEW)</button>
  <label><input type="checkbox" id="cSubs"> Subtitles (voice lines play either way)</label>
  <p id="msg">Checking for VR...</p>
  <p>Built for Meta Quest 3 in the Quest Browser. Turn your volume up: the story is spoken aloud.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const msg=document.getElementById('msg');
if(typeof THREE==='undefined'){msg.textContent='three.js failed to load. This game needs an internet connection the first time.';return;}

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const V3=THREE.Vector3;
const tv1=new V3(),tv2=new V3(),tv3=new V3(),tv4=new V3(),tv5=new V3();
const tq=new THREE.Quaternion(),teu=new THREE.Euler();
const UP=new V3(0,1,0);
const HEAD=new V3(0,1.7,0),camRight=new V3(1,0,0);
const G={started:false,begun:false,xr:false,t:0,subs:false,tts:('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined'),
  hp:100,maxHp:100,mana:100,maxMana:100,ember:3,heal:0,inv:0,dead:false,deadT:0,cp:-1,manaLock:0,riding:false,ended:false,help:0,sim:false};

/* ================= renderer / scene ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.xr.enabled=true;
try{renderer.xr.setReferenceSpaceType('local-floor')}catch(e){}
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const FOGC=0x0c1017;
scene.background=new THREE.Color(FOGC);
scene.fog=new THREE.FogExp2(FOGC,0.03);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,520);
const rig=new THREE.Group();scene.add(rig);rig.add(camera);camera.position.set(0,1.65,0);
scene.add(new THREE.HemisphereLight(0x7b8cb8,0x1b1713,0.95));
const moonL=new THREE.DirectionalLight(0x9db0e0,0.6);moonL.position.set(-30,60,-40);scene.add(moonL);
const POOL=[];for(let i=0;i<4;i++){const l=new THREE.PointLight(0xffffff,0,16,2);scene.add(l);POOL.push(l)}
const lightReq=[];
function reqLight(x,y,z,color,inten,dist,prio){lightReq.push({x,y,z,color,inten,dist,prio})}
function applyLights(){lightReq.sort((a,b)=>b.prio-a.prio);for(let i=0;i<POOL.length;i++){const l=POOL[i],r=lightReq[i];if(r){l.position.set(r.x,r.y,r.z);l.color.setHex(r.color);l.intensity=r.inten;l.distance=r.dist}else l.intensity=0}lightReq.length=0}

window.addEventListener('resize',()=>{if(!renderer.xr.isPresenting){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});

/* ---- head-locked overlays ---- */
function overlayPlane(color,z,order){const m=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,depthTest:false,depthWrite:false,fog:false}));m.position.z=z;m.renderOrder=order;m.frustumCulled=false;camera.add(m);return m}
const fadeP=overlayPlane(0x000000,-.25,1000),flashP=overlayPlane(0xff2020,-.26,999);
let flashA=0;
function flash(hex,a){flashP.material.color.setHex(hex);flashA=Math.max(flashA,a)}
function textPlane(w,h,cw,ch,z,y,order){const c=document.createElement('canvas');c.width=cw;c.height=ch;const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0,depthTest:false,depthWrite:false,fog:false}));m.position.set(0,y,z);m.renderOrder=order;m.frustumCulled=false;camera.add(m);return{m,c,g:c.getContext('2d'),t,life:0,max:1}}
function drawText(P,text,size,color,bg){const g=P.g,w=P.c.width,h=P.c.height;g.clearRect(0,0,w,h);if(bg){g.fillStyle=bg;g.fillRect(0,0,w,h)}
  g.font=size+'px Georgia, serif';g.textAlign='center';g.textBaseline='middle';
  const paras=text.split('\n'),lines=[];
  for(const para of paras){let line='';for(const wd of para.split(' ')){const tst=line?line+' '+wd:wd;if(g.measureText(tst).width>w-50&&line){lines.push(line);line=wd}else line=tst}lines.push(line)}
  const lh=size*1.3,y0=h/2-(lines.length-1)*lh/2;
  g.shadowColor='#000';g.shadowBlur=8;g.fillStyle=color;
  lines.forEach((l,i)=>g.fillText(l,w/2,y0+i*lh));P.t.needsUpdate=true}
const subP=textPlane(1.5,.3,1024,200,-1.2,-.4,998);
const toastP=textPlane(1.9,.5,1024,270,-1.6,.32,997);
function showSub(sp,text,ms){if(!G.subs&&G.tts&&!Voice.broken)return;drawText(subP,(sp.name?sp.name+':  ':'')+text,34,sp.col||'#fff','rgba(0,0,0,.45)');subP.life=ms/1000+.8;subP.max=subP.life}
function toast(text,sec){drawText(toastP,text,54,'#e9e3d2');toastP.life=sec||4;toastP.max=toastP.life}
function tickText(P,dt,peak){if(P.life>0){P.life-=dt;const f=Math.min(1,P.life/.6,(P.max-P.life)/.4);P.m.material.opacity=clamp(f,0,1)*peak}else P.m.material.opacity=0}

/* ================= audio ================= */
let AC=null,master=null,noiseBuf=null;const sfxLast={};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);
  const n=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;startAmbient()}catch(e){AC=null}}
function osc(out,type,f0,f1,t0,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+.05)}
function nz(out,t0,dur,vol,ft,f0,f1,q){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=ft||'lowpass';f.frequency.setValueAtTime(f0||1000,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);if(q)f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(out);s.start(t0,Math.random());s.stop(t0+dur+.05)}
const SFX={
  orb:(o,t)=>{nz(o,t,.35,.5,'bandpass',600,200,1.5);osc(o,'sawtooth',220,70,t,.35,.12)},
  boom:(o,t)=>{nz(o,t,.7,.9,'lowpass',900,60);osc(o,'sine',90,30,t,.6,.8)},
  zap:(o,t)=>{nz(o,t,.09,.25,'highpass',2500,6000,2);osc(o,'square',300+Math.random()*600,80,t,.06,.05)},
  flesh:(o,t)=>{nz(o,t,.22,.6,'lowpass',700,150);osc(o,'sine',100,40,t,.2,.5)},
  clank:(o,t)=>{osc(o,'square',900,700,t,.08,.1);osc(o,'triangle',1800,1200,t,.15,.08);nz(o,t,.08,.3,'highpass',3000)},
  slash:(o,t)=>{nz(o,t,.18,.35,'bandpass',2200,800,1)},
  arrow:(o,t)=>{nz(o,t,.2,.3,'bandpass',1800,3200,1)},
  groan:(o,t)=>{osc(o,'sawtooth',70+Math.random()*40,45,t,.9,.2);nz(o,t,.9,.12,'bandpass',300,150,2)},
  whisper:(o,t)=>{nz(o,t,1.2,.25,'bandpass',2600,1800,6)},
  roar:(o,t)=>{osc(o,'sawtooth',60,28,t,2,.45);osc(o,'square',45,25,t,2,.3);nz(o,t,2,.45,'lowpass',500,100)},
  stomp:(o,t)=>{osc(o,'sine',70,22,t,.9,1);nz(o,t,.8,.9,'lowpass',500,50)},
  ward:(o,t)=>{osc(o,'sine',400,900,t,.25,.2);osc(o,'triangle',800,1600,t,.25,.1)},
  shatter:(o,t)=>{nz(o,t,.5,.6,'highpass',1500,5000)},
  chime:(o,t)=>{[523,659,784,1047].forEach((f,i)=>osc(o,'sine',f,0,t+i*.09,1.6,.15))},
  bell:(o,t)=>{osc(o,'sine',196,0,t,5,.25);osc(o,'sine',392,0,t,3,.12);osc(o,'sine',587,0,t,2,.06)},
  heal:(o,t)=>{osc(o,'sine',300,700,t,1,.18)},
  hurt:(o,t)=>{nz(o,t,.3,.6,'lowpass',500,120);osc(o,'sawtooth',120,60,t,.3,.3)},
  dodge:(o,t)=>{nz(o,t,.25,.3,'bandpass',900,2500,.8)},
  rumble:(o,t)=>{nz(o,t,2.6,.6,'lowpass',200,60)},
  thump:(o,t)=>{osc(o,'sine',55,35,t,.3,.7)},
  nova:(o,t)=>{osc(o,'sine',200,40,t,1.2,.9);nz(o,t,1,.8,'lowpass',2000,100)},
  rise:(o,t)=>{nz(o,t,1,.4,'lowpass',400,150)},
  grind:(o,t)=>{nz(o,t,3.5,.5,'lowpass',180,90);osc(o,'sawtooth',40,30,t,3.5,.2)}
};
function sfx(name,pos,vol){if(!AC||!SFX[name])return;const now=AC.currentTime;if(sfxLast[name]&&now-sfxLast[name]<.045)return;sfxLast[name]=now;
  let v=vol===undefined?1:vol,pan=0;
  if(pos){const d=pos.distanceTo(HEAD);v*=clamp(1-d/55,0,1);if(v<.03)return;tv5.copy(pos).sub(HEAD);pan=clamp(tv5.dot(camRight)/Math.max(d,1),-1,1)}
  const out=AC.createGain();out.gain.value=v;
  if(AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=pan;out.connect(pn);pn.connect(master)}else out.connect(master);
  try{SFX[name](out,now)}catch(e){}}
function startAmbient(){
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=380;f.Q.value=.7;
  const g=AC.createGain();g.gain.value=.1;const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.12;lg.gain.value=.05;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  s.connect(f);f.connect(g);g.connect(master);s.start();
  [55,55.4,82.5].forEach((fr,i)=>{const o=AC.createOscillator(),gg=AC.createGain();o.type=i===2?'sine':'triangle';o.frequency.value=fr;gg.gain.value=i===2?.015:.03;o.connect(gg);gg.connect(master);o.start()})}

/* ================= voice (speech synthesis) ================= */
const Voice={q:[],speaking:false,cur:null,t0:0,est:0,started:false,voices:[],broken:false};
function loadVoices(){try{Voice.voices=window.speechSynthesis.getVoices()||[]}catch(e){}}
if(G.tts){loadVoices();try{window.speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
const SPK={
  curse:{name:'THE CURSE',pitch:.35,rate:.8,vol:1,g:'m',i:0,col:'#aab6ff'},
  maren:{name:'MAREN',pitch:1.15,rate:.88,vol:.95,g:'f',i:0,col:'#9fe0ff'},
  veyl:{name:'SIR VEYL',pitch:.6,rate:.92,vol:1,g:'m',i:1,col:'#ff9a8a'},
  warden:{name:'THE GRAVEWARDEN',pitch:.05,rate:.6,vol:1,g:'m',i:2,col:'#ffb36b'},
  wraith:{name:'',pitch:1.8,rate:.65,vol:.6,g:'f',i:1,col:'#b9a7ff'}
};
function pickVoice(sp){const en=Voice.voices.filter(v=>/^en/i.test(v.lang));if(!en.length)return null;
  const mre=/male|david|daniel|george|james|mark|alex|fred|thomas|arthur|oliver/i,fre=/female|zira|samantha|susan|karen|moira|fiona|hazel|serena|kate|victoria|tessa/i;
  let pool=en.filter(v=>sp.g==='f'?fre.test(v.name):(mre.test(v.name)&&!/female/i.test(v.name)));if(!pool.length)pool=en;return pool[sp.i%pool.length]}
function say(who,text,o){o=o||{};if(o.bark&&(Voice.speaking||Voice.q.length>0))return;
  if(o.cut){Voice.q.length=0;if(G.tts){try{speechSynthesis.cancel()}catch(e){}}Voice.speaking=false;Voice.cur=null}
  Voice.q.push({who,text});pumpVoice()}
function pumpVoice(){if(Voice.speaking)return;const it=Voice.q.shift();if(!it)return;const sp=SPK[it.who]||SPK.curse;
  Voice.speaking=true;Voice.t0=performance.now();Voice.est=Math.max(1400,it.text.length*75/sp.rate+600);Voice.started=false;
  showSub(sp,it.text,Voice.est);
  if(!G.tts||Voice.broken){Voice.cur=null;return}
  try{const u=new SpeechSynthesisUtterance(it.text);u.pitch=sp.pitch;u.rate=sp.rate;u.volume=sp.vol;const v=pickVoice(sp);if(v)u.voice=v;u.lang=(v&&v.lang)||'en-US';
    const done=()=>{if(Voice.cur===u){Voice.cur=null;Voice.speaking=false;pumpVoice()}};
    u.onstart=()=>{Voice.started=true};u.onend=done;u.onerror=done;Voice.cur=u;speechSynthesis.speak(u)}catch(e){Voice.broken=true;Voice.cur=null}}
function voiceTick(){if(!Voice.speaking)return;const el=performance.now()-Voice.t0;
  if(G.tts&&!Voice.broken&&!Voice.started&&el>4500){Voice.broken=true;try{speechSynthesis.cancel()}catch(e){}}
  if(el>Voice.est+((G.tts&&!Voice.broken)?4000:0)){Voice.speaking=false;Voice.cur=null;try{if(G.tts)speechSynthesis.cancel()}catch(e){}pumpVoice()}}

/* ================= geometry/material helpers ================= */
const GC={};
function BG(w,h,d){const k='b'+w+'_'+h+'_'+d;return GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d))}
function SGeo(r,ws,hs){ws=ws||10;hs=hs||8;const k='s'+r+'_'+ws;return GC[k]||(GC[k]=new THREE.SphereGeometry(r,ws,hs))}
function CGeo(rt,rb,h,s){s=s||8;const k='c'+rt+'_'+rb+'_'+h+'_'+s;return GC[k]||(GC[k]=new THREE.CylinderGeometry(rt,rb,h,s))}
function mk(g,m,x,y,z,parent){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(parent)parent.add(o);return o}
function limb(len,w,mat,x,y){const p=new THREE.Group();p.position.set(x,y,0);const m=new THREE.Mesh(BG(w,len,w),mat);m.position.y=-len/2;p.add(m);p.userData.m=m;return p}
function canvasTex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const texGround=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#26291f';g.fillRect(0,0,w,h);for(let i=0;i<4500;i++){const s=(Math.random()*26)|0;g.fillStyle='rgba('+(28+s)+','+(34+s)+','+(24+s)+','+(Math.random()*.7)+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3)}},90,90);
const texRoad=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#2b2822';g.fillRect(0,0,w,h);for(let i=0;i<700;i++){const s=(Math.random()*30)|0;g.fillStyle='rgb('+(48+s)+','+(44+s)+','+(38+s)+')';const r=2+Math.random()*7;g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,r,r*.7,Math.random()*3,0,6.28);g.fill()}},1,28);
const texStone=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#17181b';g.fillRect(0,0,w,h);for(let y=0;y<8;y++)for(let x=-1;x<5;x++){const ox=(y%2)*32,s=(Math.random()*20)|0;g.fillStyle='rgb('+(58+s)+','+(60+s)+','+(66+s)+')';g.fillRect(x*64+ox+2,y*32+2,60,28)}},1,1);
const texFlag=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#14151a';g.fillRect(0,0,w,h);for(let y=0;y<4;y++)for(let x=0;x<4;x++){const s=(Math.random()*18)|0;g.fillStyle='rgb('+(46+s)+','+(48+s)+','+(54+s)+')';g.fillRect(x*64+2,y*64+2,60,60)}},13,14);
const texBars=canvasTex(128,128,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='#2a2c33';for(let i=0;i<8;i++)g.fillRect(i*16+5,0,6,h);g.fillRect(0,20,w,6);g.fillRect(0,100,w,6)},1,1);
const texGlow=canvasTex(64,64,(g,w,h)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});
const texDot=canvasTex(32,32,(g,w,h)=>{const gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.8,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32)});
function stoneMat(rx,ry){const t=texStone.clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return new THREE.MeshStandardMaterial({map:t,roughness:.95,color:0xb0b0b0})}
function glowSprite(color,size,parent,x,y,z){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:texGlow,color,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));s.scale.set(size,size,1);s.position.set(x||0,y||0,z||0);if(parent)parent.add(s);return s}
const MAT={
  ground:new THREE.MeshStandardMaterial({map:texGround,roughness:1,color:0xc0c0c0}),
  road:new THREE.MeshStandardMaterial({map:texRoad,roughness:1}),
  flag:new THREE.MeshStandardMaterial({map:texFlag,roughness:.9}),
  stoneFlat:new THREE.MeshStandardMaterial({color:0x44464d,roughness:.95}),
  dark:new THREE.MeshStandardMaterial({color:0x1b1b20,roughness:.9}),
  wood:new THREE.MeshStandardMaterial({color:0x2e2319,roughness:1}),
  iron:new THREE.MeshStandardMaterial({color:0x2a2c33,roughness:.5,metalness:.8}),
  grave:new THREE.MeshStandardMaterial({color:0x62666c,roughness:1}),
  pit:new THREE.MeshBasicMaterial({color:0x020203}),
  skin:new THREE.MeshStandardMaterial({color:0x7a8270,roughness:1}),
  rag:new THREE.MeshStandardMaterial({color:0x34312b,roughness:1}),
  armor:new THREE.MeshStandardMaterial({color:0x30333c,roughness:.45,metalness:.85}),
  bossArmor:new THREE.MeshStandardMaterial({color:0x3a3d47,roughness:.55,metalness:.7}),
  bossDark:new THREE.MeshStandardMaterial({color:0x1a1b20,roughness:.6,metalness:.8}),
  eye:new THREE.MeshBasicMaterial({color:0xffb347}),
  red:new THREE.MeshBasicMaterial({color:0xff2a14}),
  flame:new THREE.MeshBasicMaterial({color:0xffa040}),
  crystal:new THREE.MeshBasicMaterial({color:0xff7a1a}),
  sigil:new THREE.MeshBasicMaterial({color:0x7dd6ff}),
  ghost:new THREE.MeshStandardMaterial({color:0x6b88c8,emissive:0x223355,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide}),
  wraith:new THREE.MeshStandardMaterial({color:0x2a2440,emissive:0x1a1033,transparent:true,opacity:.7,depthWrite:false,side:THREE.DoubleSide})
};

/* ================= colliders ================= */
const circles=[],rects=[],dyn=[];
const BOUND={x0:-68,x1:68,z0:-181,z1:22};
function collide(p,r){
  for(const c of circles){const dx=p.x-c.x,dz=p.z-c.z,d2=dx*dx+dz*dz,m=r+c.r;if(d2<m*m){const d=Math.sqrt(d2)||.001,k=(m-d)/d;p.x+=dx*k;p.z+=dz*k}}
